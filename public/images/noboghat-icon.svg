<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#072b4a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#56CCF2" />
    </linearGradient>
  </defs>

  <!-- Clean rounded badge for maximum contrast on both dark & light browser tabs -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Minimal Bridge Silhouette in background -->
  <path d="M 14 74 Q 64 24 114 74" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3"/>
  <rect x="38" y="46" width="2.5" height="28" fill="#ffffff" opacity="0.3"/>
  <rect x="63" y="34" width="2.5" height="40" fill="#ffffff" opacity="0.3"/>
  <rect x="88" y="46" width="2.5" height="28" fill="#ffffff" opacity="0.3"/>

  <!-- Golden Sun -->
  <circle cx="64" cy="24" r="8" fill="#2E8B57" opacity="0.95"/>
  <circle cx="64" cy="24" r="6" fill="#F2C94C"/>

  <!-- Cargo Containers -->
  <!-- Container 1 (Bangladesh Green) -->
  <rect x="28" y="52" width="22" height="22" rx="3" fill="#2E8B57"/>
  <line x1="35" y1="52" x2="35" y2="74" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <line x1="42" y1="52" x2="42" y2="74" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Container 2 (River Cyan / Blue) -->
  <rect x="53" y="52" width="22" height="22" rx="3" fill="#2F80ED"/>
  <line x1="60" y1="52" x2="60" y2="74" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <line x1="67" y1="52" x2="67" y2="74" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Modern Boat Cabin -->
  <rect x="78" y="52" width="18" height="22" rx="2" fill="#ffffff"/>
  <rect x="83" y="57" width="8" height="8" rx="1.5" fill="#0F4C81"/>
  <path d="M 75 52 L 99 52 L 97 48 L 77 48 Z" fill="#ffffff"/>

  <!-- Cargo Boat Hull -->
  <path d="M 16 74 L 112 74 L 120 88 L 10 88 Z" fill="#ffffff"/>

  <!-- Stylized River Waves -->
  <path d="M 6 98 Q 21 91 36 98 T 66 98 T 96 98 T 122 98" fill="none" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 6 108 Q 21 101 36 108 T 66 108 T 96 108 T 122 108" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
</svg>