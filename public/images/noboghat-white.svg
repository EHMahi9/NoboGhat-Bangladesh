<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <!-- Minimal Bridge Silhouette -->
  <path d="M 10 70 Q 60 20 110 70" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>
  <rect x="34" y="42" width="2" height="28" fill="#FFFFFF" opacity="0.25"/>
  <rect x="59" y="30" width="2" height="40" fill="#FFFFFF" opacity="0.25"/>
  <rect x="84" y="42" width="2" height="28" fill="#FFFFFF" opacity="0.25"/>

  <!-- Minimal Sun (Authentic Bangladesh Green #2E8B57) -->
  <circle cx="60" cy="20" r="8" fill="#2E8B57" opacity="0.95"/>

  <!-- Cargo Containers -->
  <!-- Container 1 (Authentic Bangladesh Green #2E8B57) -->
  <rect x="25" y="48" width="22" height="22" rx="2" fill="#2E8B57"/>
  <line x1="32" y1="48" x2="32" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="39" y1="48" x2="39" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Container 2 (Authentic River Blue #2F80ED) -->
  <rect x="50" y="48" width="22" height="22" rx="2" fill="#2F80ED"/>
  <line x1="57" y1="48" x2="57" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="48" x2="64" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Modern Boat Cabin (White for Dark Surface) -->
  <rect x="75" y="48" width="18" height="22" rx="2" fill="#FFFFFF"/>
  <rect x="80" y="53" width="8" height="8" rx="1" fill="#0F4C81"/>
  <path d="M 72 48 L 96 48 L 94 44 L 74 44 Z" fill="#FFFFFF"/>

  <!-- Cargo Boat Hull (White for Dark Surface) -->
  <path d="M 12 70 L 108 70 L 118 85 L 7 85 Z" fill="#FFFFFF"/>

  <!-- Stylized River Waves (Authentic River Blue #2F80ED) -->
  <path d="M 0 95 Q 15 88 30 95 T 60 95 T 90 95 T 120 95" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round"/>
  <path d="M 0 105 Q 15 98 30 105 T 60 105 T 90 105 T 120 105" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Clean Typography (Nobo in White, Ghat in Authentic River Blue #2F80ED) -->
  <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Nobo<tspan fill="#2F80ED">Ghat</tspan></text>
</svg>
