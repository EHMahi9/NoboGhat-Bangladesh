<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access | NoboGhat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Shared Modular CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    
    <!-- Auth Specific CSS -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-body">

    <!-- Minimal Navbar for Auth Page -->
    <nav class="navbar">
        <a href="../index.html" class="logo-link">
            <img src="../assets/images/illustrations/noboghat-svg.svg" alt="NoboGhat Logo" class="logo">
        </a>
        <a href="../index.html" class="btn-outline-back"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </nav>

    <!-- Authentication Container -->
    <main class="auth-container">
        <div class="auth-box">
            
            <h2 class="auth-title">Welcome to NoboGhat</h2>
            <p class="auth-subtitle">Digitalizing Bangladesh's river routes for smarter cargo logistics.</p>

            <!-- Google Login - Prominent at Top -->
            <a id="googleLogin" class="auth-btn google-login" href="#">
                <i class="fa-brands fa-google"></i> Continue with Google
            </a>

            <div class="oauth-divider"><span>or</span></div>

            <!-- Tab Navigation for Manual Forms -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="toggleAuth('login')">Sign In</button>
                <button class="auth-tab" id="tab-register" onclick="toggleAuth('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary auth-btn">Sign In</button>
                <div class="auth-error"></div>
                <p class="auth-footer-text">Forgot password? <a href="#" id="forgotPasswordLink">Recover account</a></p>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="e.g., Ebnul Hasan Mahi" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regRole">Select Your Role</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-briefcase"></i>
                        <select id="regRole" required>
                            <option value="" disabled selected>Choose a role...</option>
                            <option value="farmer">Farmer</option>
                            <option value="trader">Small Trader</option>
                            <option value="owner">Boat Owner</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Create a secure password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary auth-btn">Create Account</button>
                <div class="auth-error"></div>
            </form>

        </div>
    </main>

    <!-- Password Recovery Modal (Task 3) -->
    <div id="recoverModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2>Recover Account</h2>
            <p>Enter your email address and we'll send you a recovery token.</p>

            <!-- Step 1: Request token -->
            <form id="forgotPasswordForm" class="booking-form">
                <div class="input-group">
                    <label for="recoverEmail">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="recoverEmail" placeholder="you@example.com" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary auth-btn">Send Recovery Token</button>
                <p id="recoverMessage" class="booking-message" hidden></p>
                <p class="auth-footer-text"><a href="#" id="closeRecoverModal">Close</a></p>
            </form>

            <!-- Step 2: Reset password with token -->
            <form id="resetPasswordForm" class="booking-form" style="display:none;">
                <div class="input-group">
                    <label for="resetToken">Recovery Token</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="resetToken" placeholder="Enter the token shown in the console" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="resetNewPassword">New Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="resetNewPassword" placeholder="Create a new password" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary auth-btn">Reset Password</button>
                <p id="resetMessage" class="booking-message" hidden></p>
                <p class="auth-footer-text"><a href="#" id="backToForgot">Back</a> · <a href="#" id="closeRecoverModal2">Close</a></p>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/animations.js"></script>
</body>
</html>
