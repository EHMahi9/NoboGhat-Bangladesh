spring.config.import=optional:file:.env[.properties]
spring.application.name=noboghat
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Flyway handles schema initialization now
spring.sql.init.mode=never
spring.flyway.enabled=false

# HikariCP Connection Pool Tuning
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Cache Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Use a long, private value for JWT_SECRET outside local development. Keeping it
# configurable prevents valid tokens from becoming invalid every application restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.frontend-url=${FRONTEND_URL:https://noboghatbangladesh.vercel.app}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://noboghatbangladesh.vercel.app,http://localhost:5500,http://127.0.0.1:5500}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=noboghat
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
